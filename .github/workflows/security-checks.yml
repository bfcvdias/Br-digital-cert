name: Security checks
on:
  pull_request:
  push:
    branches: ['codex/security-lead-defense']
permissions:
  contents: read
jobs:
  security-tests:
    name: security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test lead safeguards, MF flow, timing and consent offline
        run: |
          node --test apps-script/test.cjs site/test-mf-timing.cjs site/test-lead-bot.cjs
          node tests/google-consent.cjs
          node tests/clarity-consent.cjs
